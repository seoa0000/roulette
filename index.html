<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배틀 가챠미소년 ✨</title>
  <meta name="description" content="귀여운 미소년/빌런과 배틀하는 파스텔톤 가챠 게임! 시비 걸고 승리를 거머쥐어라!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Serif+KR:wght@300;600;900&display=swap"
    rel="stylesheet" />
  <style>
    /* ===== DARK FANTASY & MINIMALIST VARIABLES ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0F0F1B;
      --navy-deep: #050508;
      --navy-light: #1A1A2E;
      --crimson: #E94560;
      --silver: #C0C0C0;
      --cyan-glow: #00D1FF;
      --purple-glow: #BC13FE;
      --text-white: #E0E0E0;
      --text-gray: #A0A0A0;
      --bg: #0A0A12;
      --card-bg: rgba(22, 33, 62, 0.8);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      --glow-cyan: 0 0 15px rgba(0, 209, 255, 0.4);
      --glow-crimson: 0 0 15px rgba(233, 69, 96, 0.4);
    }

    html,
    body {
      height: 100%;
      font-family: 'Noto Serif KR', serif;
      background: var(--bg);
      color: var(--text-white);
      overflow-x: hidden;
    }

    /* ===== BACKGROUND DECORATION ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(26, 26, 46, 0.5) 0%, transparent 50%),
        radial-gradient(circle at 90% 10%, rgba(233, 69, 96, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #0A0A12 0%, #16213E 100%);
      z-index: -1;
    }

    /* ===== FLOATING STARS ===== */
    .star-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star-bg span {
      position: absolute;
      display: block;
      animation: floatStar linear infinite;
      opacity: 0;
      font-size: 1rem;
    }

    @keyframes floatStar {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.6;
      }

      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .screen.active {
      display: flex;
    }

    /* ===== START SCREEN ===== */
    #screen-start {
      text-align: center;
      gap: 24px;
    }

    .game-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: logoBounce 2s ease-in-out infinite;
    }

    @keyframes logoBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    .logo-sub {
      font-size: 0.85rem;
      color: var(--cyan-glow);
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 300;
    }

    .logo-title {
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      font-family: 'Noto Serif KR', serif;
      font-weight: 900;
      background: linear-gradient(180deg, #FFF, var(--silver), #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin: 10px 0;
    }

    .logo-emoji-row {
      display: flex;
      gap: 12px;
      font-size: 2rem;
      animation: emojiDance 1.5s ease-in-out infinite;
    }

    .logo-emoji-row span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .logo-emoji-row span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes emojiDance {

      0%,
      100% {
        transform: rotate(-10deg) scale(1);
      }

      50% {
        transform: rotate(10deg) scale(1.15);
      }
    }

    .start-desc {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 16px 28px;
      color: var(--text-gray);
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 400px;
      font-weight: 300;
    }

    /* ===== BUTTONS ===== */
    .btn {
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(100%);
      transition: transform 0.3s;
    }

    .btn:hover::after {
      transform: translateY(0);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--navy-light);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      box-shadow: var(--glow-cyan);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--text-gray);
      color: var(--text-gray);
    }

    .btn-small {
      font-size: 0.9rem;
      padding: 8px 20px;
      border-radius: 30px;
    }

    .btn-outline {
      background: white;
      border: 2.5px solid var(--pink-deep);
      color: var(--pink-deep);
      box-shadow: var(--shadow);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ===== INPUT SCREEN ===== */
    #screen-input {
      gap: 24px;
      text-align: center;
    }

    .input-card {
      background: var(--navy-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 32px;
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
    }

    .input-title {
      font-size: 1.4rem;
      color: var(--text-white);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-sub {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-white);
      outline: none;
      transition: all 0.3s;
      resize: none;
    }

    .input-field:focus {
      border-color: var(--cyan-glow);
      box-shadow: var(--glow-cyan);
    }

    .input-field::placeholder {
      color: var(--text-light);
    }

    .input-hint {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 8px;
      text-align: left;
    }

    /* ===== GACHA ROULETTE SCREEN ===== */
    #screen-gacha {
      gap: 20px;
      text-align: center;
    }

    .roulette-title {
      font-size: 1.8rem;
      color: var(--text-dark);
    }

    .roulette-title span {
      color: var(--pink-deep);
    }

    .roulette-box {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      max-width: 460px;
      width: 100%;
    }

    .roulette-label {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .roulette-strip-wrapper {
      overflow: hidden;
      border-radius: 12px;
      background: var(--pink-light);
      height: 52px;
      position: relative;
      margin-bottom: 12px;
    }

    .roulette-strip-wrapper::before,
    .roulette-strip-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40px;
      z-index: 2;
    }

    .roulette-strip-wrapper::before {
      left: 0;
      background: linear-gradient(to right, var(--pink-light), transparent);
    }

    .roulette-strip-wrapper::after {
      right: 0;
      background: linear-gradient(to left, var(--pink-light), transparent);
    }

    .roulette-strip {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 0;
      will-change: transform;
    }

    .roulette-item {
      flex-shrink: 0;
      padding: 0 18px;
      font-size: 0.95rem;
      color: var(--text-dark);
      white-space: nowrap;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .roulette-item.highlight {
      background: linear-gradient(135deg, var(--pink-deep), var(--purple));
      color: white;
      border-radius: 10px;
      font-size: 1.05rem;
    }

    .roulette-arrow {
      text-align: center;
      font-size: 1.5rem;
      margin: -4px 0;
    }

    /* ===== BATTLE SCREEN ===== */
    #screen-battle {
      gap: 16px;
      padding-bottom: 40px;
    }

    /* Announcement banner */
    .announce-banner {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-gray);
      border-radius: 4px;
      padding: 14px 24px;
      text-align: center;
      font-size: 0.9rem;
      max-width: 520px;
      width: 100%;
      animation: bannerPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .announce-banner .char-name {
      font-size: 1.1rem;
      color: var(--cyan-glow);
      font-weight: 700;
    }

    .announce-rate {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* Character Card */
    .char-card-wrapper {
      perspective: 800px;
    }

    .char-card {
      background: var(--navy-light);
      border-radius: 2px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      max-width: 320px;
      width: 100%;
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* TCG style Neon Glows */
    .grade-L { box-shadow: 0 0 25px var(--cyan-glow), var(--shadow); border-color: var(--cyan-glow); }
    .grade-SSR { box-shadow: 0 0 20px var(--crimson), var(--shadow); border-color: var(--crimson); }
    .grade-SR { box-shadow: 0 0 15px #BC13FE, var(--shadow); border-color: #BC13FE; }
    .grade-R { box-shadow: 0 0 10px #C0C0C0, var(--shadow); border-color: #C0C0C0; }
    .grade-UC { border-color: rgba(255,255,255,0.4); }
    .grade-C { border-color: rgba(255,255,255,0.1); }

    @keyframes rainbowBorder {
      0% {
        box-shadow: 0 0 25px 6px #FF6B9D, var(--shadow-lg);
      }

      16% {
        box-shadow: 0 0 25px 6px #FFD700, var(--shadow-lg);
      }

      33% {
        box-shadow: 0 0 25px 6px #A8FF78, var(--shadow-lg);
      }

      50% {
        box-shadow: 0 0 25px 6px #78D5FF, var(--shadow-lg);
      }

      66% {
        box-shadow: 0 0 25px 6px #C9B1FF, var(--shadow-lg);
      }

      83% {
        box-shadow: 0 0 25px 6px #FFB7C5, var(--shadow-lg);
      }

      100% {
        box-shadow: 0 0 25px 6px #FF6B9D, var(--shadow-lg);
      }
    }

    .grade-badge {
      position: absolute;
      top: -12px;
      right: 16px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      color: white;
    }

    .badge-L {
      background: linear-gradient(90deg, #FF6B9D, #FFD700, #A8FF78, #78D5FF, #C9B1FF);
      animation: badgeShimmer 2s linear infinite;
      background-size: 200%;
    }

    .badge-SSR {
      background: linear-gradient(90deg, #FFD700, #FFA500);
    }

    .badge-SR {
      background: linear-gradient(90deg, var(--purple), #9B8FFF);
    }

    .badge-R {
      background: linear-gradient(90deg, var(--pink-deep), #FF6B9D);
    }

    .badge-UC {
      background: linear-gradient(90deg, var(--blue-deep), var(--blue));
      color: #3A7FA0;
    }

    .badge-C {
      background: #C8C0D4;
      color: #66587A;
    }

    @keyframes badgeShimmer {
      0% {
        background-position: 0%;
      }

      100% {
        background-position: 200%;
      }
    }

    .char-img-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }

    .char-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .char-img-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .grade-L .char-img-ring {
      border-color: transparent;
      background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #FF6B9D, #FFD700, #78D5FF, #C9B1FF) border-box;
    }

    .grade-SSR .char-img-ring {
      border-color: var(--yellow-deep);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }

    .grade-SR .char-img-ring {
      border-color: var(--purple);
      box-shadow: 0 0 10px rgba(201, 177, 255, 0.7);
    }

    .grade-R .char-img-ring {
      border-color: var(--pink-deep);
    }

    .grade-UC .char-img-ring {
      border-color: var(--blue-deep);
    }

    .grade-C .char-img-ring {
      border-color: #C8C0D4;
    }

    .char-name-big {
      font-size: 1.4rem;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .char-level {
      font-size: 0.9rem;
      color: var(--text-mid);
      background: var(--pink-light);
      display: inline-block;
      padding: 3px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .char-type-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .tag-misoboy {
      background: var(--pink-light);
      color: var(--pink-deep);
    }

    .tag-villain {
      background: #2D1B2E;
      color: #FF85A1;
    }

    /* ===== BATTLE AREA ===== */
    .battle-area {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Speech Bubble */
    .bubble {
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 85%;
      position: relative;
      animation: bubblePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bubblePop {
      from {
        transform: scale(0.3);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .bubble-user {
      background: var(--navy-light);
      color: var(--text-white);
      align-self: flex-end;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .bubble-char {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    /* Rampage reply */
    .bubble-rampage {
      background: linear-gradient(135deg, #1A0A0A, #3D0000);
      color: #FF3030;
      font-size: 1.4rem;
      border: 2px solid #FF3030;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), var(--shadow-lg);
      animation: bubblePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), rampageShake 0.5s ease 0.4s 3;
    }

    @keyframes rampageShake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px) rotate(-1deg);
      }

      75% {
        transform: translateX(5px) rotate(1deg);
      }
    }

    /* Shy reply */
    .bubble-shy {
      background: rgba(200, 192, 212, 0.3);
      color: #B8A9C9;
      font-size: 0.8rem;
      border: 1px dashed #C8C0D4;
      box-shadow: none;
      opacity: 0.75;
    }

    /* Shake animation for character hit */
    @keyframes charShake {

      0%,
      100% {
        transform: translateX(0) rotate(0deg);
      }

      20% {
        transform: translateX(-8px) rotate(-3deg);
      }

      40% {
        transform: translateX(8px) rotate(3deg);
      }

      60% {
        transform: translateX(-6px) rotate(-2deg);
      }

      80% {
        transform: translateX(6px) rotate(2deg);
      }
    }

    .char-shake {
      animation: charShake 0.4s ease !important;
    }

    /* Screen shake */
    @keyframes screenShake {

      0%,
      100% {
        transform: translate(0);
      }

      20% {
        transform: translate(-6px, 3px);
      }

      40% {
        transform: translate(6px, -4px);
      }

      60% {
        transform: translate(-4px, 5px);
      }

      80% {
        transform: translate(5px, -2px);
      }
    }

    .screen-shake {
      animation: screenShake 0.5s ease 3;
    }

    /* Screen rumble (Kugugung) */
    @keyframes screenRumble {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-10px, -10px); }
      30% { transform: translate(10px, 10px); }
      50% { transform: translate(-10px, 10px); }
      70% { transform: translate(10px, -10px); }
      90% { transform: translate(-5px, -5px); }
    }
    .screen-rumble {
      animation: screenRumble 0.4s ease-out;
    }

    /* Flash effect */
    @keyframes screenFlash {
      0% { background-color: transparent; }
      20% { background-color: rgba(255, 255, 255, 0.7); }
      100% { background-color: transparent; }
    }
    .screen-flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }
    .screen-flash-overlay.active {
      display: block;
      animation: screenFlash 0.3s ease-out;
    }

    /* Hit effect */
    .hit-effect {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: var(--pink-deep);
      pointer-events: none;
      animation: hitFly 0.8s ease forwards;
      z-index: 100;
    }

    @keyframes hitFly {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, calc(-50% - 80px)) scale(1.5);
        opacity: 0;
      }
    }

    /* ===== RESULT ===== */
    .result-banner {
      text-align: center;
      padding: 24px;
      border-radius: 28px;
      width: 100%;
      max-width: 400px;
      animation: resultReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes resultReveal {
      0% {
        transform: scale(0) rotate(-10deg);
        opacity: 0;
      }

      70% {
        transform: scale(1.1) rotate(3deg);
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .result-win {
      background: linear-gradient(135deg, var(--mint), var(--blue));
      color: #2E7D5E;
      border: 3px solid #6ECFA5;
      box-shadow: 0 0 30px rgba(110, 207, 165, 0.5), var(--shadow-lg);
    }

    .result-lose {
      background: linear-gradient(135deg, var(--pink-light), var(--peach));
      color: var(--pink-deep);
      border: 3px solid var(--pink-deep);
      box-shadow: 0 0 30px rgba(255, 133, 161, 0.4), var(--shadow-lg);
    }

    .result-big {
      font-size: 3rem;
    }

    .result-msg {
      font-size: 1rem;
      margin-top: 8px;
      color: inherit;
      opacity: 0.85;
    }

    .result-gungsuh {
      font-family: 'Gungsuh', 'Batang', serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #333;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .result-score {
      font-size: 0.85rem;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* ===== DEX SCREEN ===== */
    #screen-dex {
      gap: 20px;
      padding: 30px 20px;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .dex-header {
      text-align: center;
      width: 100%;
      max-width: 560px;
    }

    .dex-title {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--pink-deep), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dex-count {
      font-size: 0.9rem;
      color: var(--text-mid);
      margin-top: 4px;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }

    .dex-entry {
      background: white;
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: default;
    }

    .dex-entry:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .dex-entry.undiscovered {
      opacity: 0.45;
      filter: grayscale(1);
    }

    .dex-entry img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 6px;
    }

    .dex-name {
      font-size: 0.75rem;
      color: var(--text-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dex-grade-pill {
      font-size: 0.6rem;
      padding: 1px 6px;
      border-radius: 8px;
      margin-top: 3px;
      display: inline-block;
    }

    /* ===== NAV ===== */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-top: 2px solid var(--pink-light);
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 20px 14px;
      z-index: 50;
    }

    .nav-btn {
      font-family: 'Jua', sans-serif;
      font-size: 0.85rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      color: var(--text-light);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .nav-btn .nav-icon {
      font-size: 1.3rem;
    }

    .nav-btn.active {
      color: var(--pink-deep);
      background: var(--pink-light);
    }

    .nav-btn:hover:not(.active) {
      color: var(--text-mid);
    }

    /* ===== LOADING ===== */
    .loading-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 20px;
    }

    .loading-dots span {
      width: 12px;
      height: 12px;
      background: var(--pink-deep);
      border-radius: 50%;
      animation: dotBounce 1.2s ease infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
      background: var(--purple);
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
      background: var(--blue-deep);
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-16px);
      }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--pink-light);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--pink);
      border-radius: 3px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 500px) {
      .dex-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      }

      .announce-banner {
        font-size: 0.95rem;
      }
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ===== AURA for villain L ===== */
    .villain-L-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 0, 0, 0.15) 0%, transparent 70%);
      animation: auraBreath 1.5s ease-in-out infinite;
    }

    @keyframes auraBreath {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* ===== BATTLE PROGRESS BAR ===== */
    .battle-phase-label {
      font-size: 0.85rem;
      color: var(--text-light);
      text-align: center;
    }

    .section-sep {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--pink-light), transparent);
    }

    /* Aaya reaction */
    .aaya-text {
      font-size: 1.5rem;
      color: var(--pink-deep);
      text-align: center;
      animation: aayaPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes aayaPop {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Chat History & Input */
    .battle-chat-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      padding: 16px;
      margin-top: 10px;
    }

    #battle-history {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      background: white;
      padding: 8px;
      border-radius: 50px;
      box-shadow: var(--shadow);
      margin-top: 8px;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #battle-user-input {
      flex: 1;
      border: none;
      padding: 10px 18px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      outline: none;
      background: transparent;
    }

    .btn-send {
      background: var(--pink-deep);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-send:hover {
      transform: scale(1.1);
    }

    .turn-counter {
      text-align: center;
      font-size: 0.8rem;
      color: var(--pink-deep);
      margin-bottom: 4px;
    }

    /* Thinking dots */
    .thinking {
      color: var(--text-light);
      font-size: 0.8rem;
      margin-left: 12px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .thinking span {
      width: 4px;

      border-radius: 50%;
      animation: thinkDot 1s infinite;
    }

    @keyframes thinkDot {
      0%, 100% { opacity: 0.3; }

    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

      const r = Math.random();
      let cumulative = 0;
      for (const g of GRADES) {

      return GRADES[GRADES.length - 1];

    function runRoulette() {
      const char = rand(CHARACTERS);
      const grade = rollGrade();
      const level = rollLevel();
      const speech = rand(SPEECHES);

      currentChar = char;
      currentGrade = grade;
      currentLevel = level;
      currentSpeech = speech;

      if (!collected[char.id]) {
        collected[char.id] = { grade: grade.key, level, speech };
      } else {
        const gradeOrder = ['L', 'SSR', 'SR', 'R', 'UC', 'C'];
        const prev = gradeOrder.indexOf(collected[char.id].grade);
        const curr = gradeOrder.indexOf(grade.key);
        if (curr < prev) collected[char.id] = { grade: grade.key, level, speech };
      }
      saveState();

      buildRouletteStrip('roulette-char', CHARACTERS.map(c => c.name), char.name);
      buildRouletteStrip('roulette-speech', SPEECHES, speech);

      setTimeout(() => {
        showBattle();
      }, 3200);
    }

    function buildRouletteStrip(containerId, items, final) {
      const strip = document.getElementById(containerId);
      if (!strip) return;
      strip.innerHTML = '';

      const pool = [];
      for (let i = 0; i < 30; i++) pool.push(rand(items));
      pool.push(final);

      pool.forEach((name, idx) => {
        const div = document.createElement('div');
        div.className = 'roulette-item' + (idx === pool.length - 1 ? ' highlight' : '');
        div.textContent = name;
        strip.appendChild(div);
      });

      const totalWidth = strip.scrollWidth;
      const viewWidth = strip.parentElement.offsetWidth;
      const finalEl = strip.lastElementChild;
      const stopX = finalEl.offsetLeft - viewWidth / 2 + finalEl.offsetWidth / 2;

      strip.style.transition = 'none';
      strip.style.transform = 'translateX(0)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          strip.style.transition = 'transform 2.8s cubic-bezier(0.25, 0.1, 0.05, 1)';
          strip.style.transform = `translateX(${-stopX}px)`;
        });
      });
    }

    function appendMessage(role, text) {
      const area = document.getElementById('battle-history');
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'bubble-user' : 'bubble-char');

      if (role === 'char') {
        bubble.innerHTML = `<strong>${currentChar.name}:</strong> ${text}`;
      } else {
        bubble.textContent = text;
      }

      area.appendChild(bubble);
      area.scrollTop = area.scrollHeight;

      chatHistory.push({ role, content: text });

      if (currentTurn === 1 && role === 'user') {
        const charCard = document.getElementById('char-card');
        charCard.classList.add('char-shake');
        setTimeout(() => charCard.classList.remove('char-shake'), 500);

        const hit = document.createElement('div');
        hit.className = 'hit-effect';
        hit.textContent = '💥';
        document.body.appendChild(hit);
        setTimeout(() => hit.remove(), 900);
      }
    }

    async function processAITurn(userMsg) {
      const indicator = document.getElementById('thinking-indicator');
      const inputArea = document.getElementById('chat-input-area');

      inputArea.style.display = 'none';
      indicator.style.display = 'block';

      try {
        await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
        const reply = AIService.generateMixedReply(userMsg, currentChar, currentTurn);

        indicator.style.display = 'none';
        appendMessage('char', reply);

        if (currentTurn < 5) {
          inputArea.style.display = 'flex';
          const input = document.getElementById('battle-user-input');
          input.focus();
        } else {
          isJudgmentPhase = true;
          setTimeout(() => showJudgment(), 800);
        }
      } catch (e) {
        console.error(e);
        indicator.style.display = 'none';
        appendMessage('char', "오류가 발생했어요. 다시 시도해볼까요?");
        inputArea.style.display = 'flex';
      }
    }

    function sendPlayerReply() {
      if (isJudgmentPhase) return;

      const input = document.getElementById('battle-user-input');
      const text = input.value.trim();
      if (!text) return;

      triggerKugugung();

      input.value = '';
      currentTurn++;
      document.getElementById('turn-counter').textContent = `TURN ${currentTurn} / 5`;

      appendMessage('user', text);
      processAITurn(text);
    }

      damage.style.color = '#ff3030';
      damage.style.fontSize = '2.5rem';
      damage.style.fontWeight = 'bold';
      damage.style.textShadow = '2px 2px 0 #fff';
      damage.style.zIndex = '100';
      damage.style.pointerEvents = 'none';
      damage.textContent = 'CRITICAL!!';
      damage.style.animation = 'damageFloat 0.6s ease-out forwards';
      card.appendChild(damage);

      if (!document.getElementById('damage-style')) {
        const s = document.createElement('style');
        s.id = 'damage-style';
        s.textContent = `
          @keyframes damageFloat {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
          }
        `;
        document.head.appendChild(s);
      }

      setTimeout(() => damage.remove(), 600);
      setTimeout(() => screen.classList.remove('screen-rumble'), 400);
    }

    async function showJudgment() {
      const area = document.getElementById('battle-history');
      const indicator = document.getElementById('thinking-indicator');
      const statusText = indicator.querySelector('.thinking');
      if (statusText) statusText.textContent = '승패 판정 중... ⚖️';
      indicator.style.display = 'block';

      const result = await AIService.fetchJudgment(chatHistory);
      indicator.style.display = 'none';

      showResult(result);
    }

    function showResult(aiResult) {
      const win = aiResult.winner === 'YOU';
      const section = document.getElementById('result-section');
      const banner = document.createElement('div');
      banner.className = 'result-banner ' + (win ? 'result-win' : 'result-lose');

      const isHardWin = win && currentLevel >= 80;

      banner.innerHTML = `
        <div class="result-gungsuh">📜 최종 심판 결과 📜</div>
        <div class="result-big">${win ? '🎉 YOU WIN! 🎉' : '💔 YOU LOSE...'}</div>
        <div class="result-msg">${aiResult.winner === 'YOU' ? '상대를 굴복시켰습니다!' : '참패하셨습니다...'}</div>
        <div style="margin-top:12px; font-size:0.9rem; line-height:1.5; background:rgba(255,255,255,0.3); padding:10px; border-radius:12px;">
          ${isHardWin ? '<strong style="color:#d32f2f">🔥 [전설의 극복] 강적을 꺾고 승리를 쟁취하셨군요! 진정한 전설로 등극하셨습니다! 🔥</strong><br/>' : ''}
          ${aiResult.reason.replace('\n', '<br/>')}
        </div>
      `;

      if (win) fireConfetti(60);

      section.appendChild(banner);
      document.getElementById('after-result-btns').style.display = 'flex';
      document.getElementById('after-result-btns').style.flexWrap = 'wrap';
      document.getElementById('after-result-btns').style.justifyContent = 'center';
      document.getElementById('after-result-btns').style.gap = '10px';
      document.getElementById('after-result-btns').style.marginTop = '16px';

      document.getElementById('chat-input-area').style.display = 'none';
      document.getElementById('turn-counter').textContent = 'BATTLE FINISHED';
    }

    // ============================================================
    //  DEX
    // ============================================================

    function renderDex() {
      const grid = document.getElementById('dex-grid');
      if (!grid) return;
      const count = Object.keys(collected).length;
      const countEl = document.getElementById('dex-count');
      if (countEl) countEl.textContent = `수집 ${count} / 50`;
      grid.innerHTML = '';

      const gradeColors = {
        L: 'linear-gradient(90deg,#FF6B9D,#FFD700,#78D5FF,#C9B1FF)',
        SSR: 'linear-gradient(90deg,#FFD700,#FFA500)',
        SR: 'linear-gradient(90deg,#C9B1FF,#9B8FFF)',
        R: 'linear-gradient(90deg,#FF85A1,#FF6B9D)',
        UC: 'linear-gradient(90deg,#6CB4D2,#A8D8EA)',
        C: '#C8C0D4',
      };

      CHARACTERS.forEach(char => {
        const entry = document.createElement('div');
        const isFound = !!collected[char.id];
        entry.className = 'dex-entry' + (isFound ? '' : ' undiscovered');

        const img = document.createElement('img');
        img.src = imgUrl(char);
        img.alt = isFound ? char.name : '???';

        const nameEl = document.createElement('div');
        nameEl.className = 'dex-name';
        nameEl.textContent = isFound ? char.name : '???';

        entry.appendChild(img);
        entry.appendChild(nameEl);

        if (isFound) {
          const g = collected[char.id].grade;
          const pill = document.createElement('div');
          pill.className = 'dex-grade-pill';
          pill.textContent = g;
          pill.style.background = gradeColors[g] || '#ccc';
          pill.style.color = (g === 'UC' || g === 'C') ? '#444' : 'white';
          entry.appendChild(pill);
        }

        grid.appendChild(entry);
      });
    }

    // ============================================================
    //  INIT
    // ============================================================

    window.onload = () => {
      loadState();
      initStars();
      updateStartCollected();

      document.getElementById('sivi-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          startSummon();
        }
      });

      document.getElementById('battle-user-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendPlayerReply();
        }
      });
    };
  </script>
</body>

</html>
